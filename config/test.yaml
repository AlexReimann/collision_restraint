/**:
  ros__parameters:
    # Fixed parameters loaded on startup
    footprint_length_front: 0.3
    footprint_length_back: 0.2
    footprint_width: 0.3

    # Dynamic parameters
    deceleration: 0.2
    execution_delay: 0.1

    min_obstacle_height: -1.0
    max_obstacle_height: 1.0

    ignore_inside_footprint: false
    distance_buffer: 0.4