/**:
  ros__parameters:
    # Fixed parameters loaded on startup
    base_link_frame: "base_link"

    footprint_length_front: 1.0  # Distance of the robot front from base_link
    footprint_length_back: 0.0  # Distance of the robot back from base_link. Needs to be >= 0.0
    footprint_width: 1.0

    # Dynamic parameters
    deceleration: 1.0  # How fast the robot can decelerate. Used to determine brake distance -> velocity scaling

    distance_buffer: 0.0  # Buffer distance to the obstacle. Aka. distance we stop in front of the obstacle __along the trajectory__.
    ignore_inside_footprint: false  # Ignore obstacle points inside the footprint

    min_obstacle_height: -1.0  # Obsacle points below are ignored (in base_link_frame)
    max_obstacle_height: 1.0  # Obsacle points above are ignored (in base_link_frame)

